# Local development database only. Run the server and client with npm (see README).
# The full app stack (docker-compose.yml) comes from the Lab 5 Starter Kit in Episode 3.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: approvalflow
      POSTGRES_PASSWORD: approvalflow
      POSTGRES_DB: approvalflow
    # Host port 5433 by default so it does not clash with a PostgreSQL on 5432.
    # If 5433 is taken too, set DB_PORT (see README "Database port").
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvalflow -d approvalflow"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
